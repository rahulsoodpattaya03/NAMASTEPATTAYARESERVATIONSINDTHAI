<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Jet Booking | Namaste Pattaya</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="/logo.png">
</head>
<body class="bg-slate-950 text-gray-100" style="font-family:system-ui,Arial,sans-serif">

<header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-cyan-500/30 px-4 py-3">
  <a href="/" class="text-gray-400 text-xs">&larr; Back to home</a>
  <h1 class="text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-amber-400 mt-1">🛩️ Private Jet Booking</h1>
  <p class="text-[11px] text-gray-500">Request a charter — we'll reply with available dates &amp; a quote</p>
</header>

<main class="max-w-lg mx-auto px-4 py-6">
  <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
    <p class="text-gray-300 text-sm leading-relaxed mb-1">Tell us your trip and we'll check aircraft availability and send you the dates &amp; pricing.</p>
    <div>
      <label class="text-[11px] text-gray-400 font-bold">Preferred Date</label>
      <input id="jDate" type="date" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm mt-1">
    </div>
    <input id="jName" placeholder="Full Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
    <input id="jRoute" placeholder="Route / State / City (e.g. Delhi → U-Tapao)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
    <div>
      <label class="text-[11px] text-gray-400 font-bold">Number of Passengers</label>
      <input id="jPax" type="number" min="1" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm mt-1">
    </div>
    <input id="jPhone" placeholder="Phone / WhatsApp (with country code)" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
    <input id="jEmail" type="email" placeholder="Email" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white text-sm">
    <button onclick="submitJet(this)" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-black font-black py-3.5 rounded-xl uppercase text-sm">Request Availability</button>
    <p class="text-[11px] text-gray-500 text-center">No payment now. Our team will contact you with available dates and a quote.</p>
  </div>
</main>

<script>
var EP='https://namastepattayareservation.app.n8n.cloud/webhook/enquiry';
function submitJet(btn){
  var name=document.getElementById('jName').value.trim();
  var phone=document.getElementById('jPhone').value.trim();
  if(!name||!phone){ alert('Please enter your name and phone.'); return; }
  var details='Date: '+document.getElementById('jDate').value
    +'\nRoute/State: '+document.getElementById('jRoute').value.trim()
    +'\nPassengers: '+document.getElementById('jPax').value;
  btn.textContent='Submitting...'; btn.disabled=true;
  fetch(EP,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'Private Jet',name:name,contact:phone,email:document.getElementById('jEmail').value.trim(),details:details})})
    .then(function(r){return r.json();}).then(function(d){ alert((d&&d.message)||'Thank you! We will send you available dates shortly.'); btn.textContent='Request Sent ✓'; })
    .catch(function(){ btn.disabled=false; btn.textContent='Request Availability'; alert('Could not submit. Please try again.'); });
}
</script>
</body>
</html>
