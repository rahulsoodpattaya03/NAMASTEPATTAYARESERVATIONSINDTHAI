<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Map — Namaste Pattaya Reservations</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{--gold:#f59e0b;--in:#ff9933;--cyan:#22d3ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e17;font-family:system-ui,-apple-system,Arial,sans-serif;color:#e8e8ef}
  #map{position:fixed;inset:0;z-index:1}
  .top{position:fixed;top:0;left:0;right:0;z-index:1000;padding:12px 12px 6px;pointer-events:none}
  .barrow{display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto;pointer-events:auto}
  .back{background:#0e1524cc;border:1px solid #26314d;color:#cfe0ff;border-radius:12px;padding:10px 12px;text-decoration:none;font-size:16px;backdrop-filter:blur(6px)}
  #q{flex:1;padding:12px 14px;border-radius:14px;border:1px solid #26314d;background:#0e1524d9;color:#e8e8ef;font-size:14px;backdrop-filter:blur(6px)}
  .chips{display:flex;gap:8px;overflow-x:auto;max-width:720px;margin:8px auto 0;pointer-events:auto;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;background:#0e1524d9;border:1px solid #26314d;color:#dbe4f3;border-radius:20px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer;backdrop-filter:blur(6px);display:flex;align-items:center;gap:5px}
  .chip.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
  .locate{position:fixed;right:16px;bottom:80px;z-index:1000;width:48px;height:48px;border-radius:50%;border:none;background:#0e1524;color:#22d3ee;font-size:20px;box-shadow:0 4px 16px rgba(0,0,0,.6);cursor:pointer;border:1px solid #26314d}
  .book{position:fixed;left:16px;bottom:20px;z-index:1000;background:#0e1524e6;border:1px solid #ff993355;color:#ffcf99;border-radius:22px;padding:9px 14px;font-size:12px;font-weight:800;box-shadow:0 4px 16px rgba(0,0,0,.6);backdrop-filter:blur(6px)}
  /* markers */
  .mk{display:flex;align-items:center;gap:5px;background:rgba(14,21,36,.92);border:1.5px solid var(--in);border-radius:11px;padding:3px 9px 3px 4px;box-shadow:0 3px 12px rgba(0,0,0,.6);white-space:nowrap;transform:translate(-8px,-50%)}
  .mk .lg{background:var(--in);color:#1a1204;border-radius:7px;font-size:11px;padding:2px 5px;font-weight:900;line-height:1}
  .mk .nm{color:#fff;font-size:12px;font-weight:800}
  .dot{width:13px;height:13px;border-radius:50%;background:#3b82f6;border:2px solid #cfe0ff;box-shadow:0 0 8px rgba(59,130,246,.9);transform:translate(-6px,-6px)}
  .leaflet-popup-content-wrapper{background:#0e1524;color:#e8e8ef;border:1px solid #26314d;border-radius:12px}
  .leaflet-popup-tip{background:#0e1524}
  .pop b{font-size:14px}
  .pop .pp{color:#34d399;font-weight:800;font-size:13px;margin:4px 0}
  .pop a{display:inline-block;margin-top:6px;background:#25D366;color:#04351a;font-weight:800;text-decoration:none;padding:7px 12px;border-radius:9px;font-size:12px}
  .pop a.v{background:#22d3ee;color:#06121f;margin-left:6px}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <div class="barrow">
    <a class="back" href="/">&larr;</a>
    <input id="q" placeholder="Search club, area, vibe…" oninput="applyFilter()">
  </div>
  <div class="chips" id="chips">
    <span class="chip on" data-f="all" onclick="setFilter(this,'all')">📍 All</span>
    <span class="chip" data-f="indian" onclick="setFilter(this,'indian')">⭐ Our Indian Clubs</span>
    <span class="chip" data-f="after" onclick="setFilter(this,'after')">🌙 Afterparty</span>
    <span class="chip" data-f="book" onclick="setFilter(this,'all')">⚡ Book now</span>
  </div>
</div>
<button class="locate" onclick="locate()" title="My location">◎</button>
<div class="book">⚡ Instant booking</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
  var WHATSAPP = "66947623990";
  var CLUBS = [
    {name:'Ikka Club', lat:12.9231, lon:100.8709, price:8000, in:true},
    {name:'The Nashaa Club', lat:12.9245, lon:100.8716, price:15000, in:true},
    {name:'Jalwa Club', lat:12.9238, lon:100.8712, price:12000, in:true},
    {name:'Jannaat Club', lat:12.9224, lon:100.8719, price:10000, in:true},
    {name:'Leela Club', lat:12.9241, lon:100.8707, price:12000, in:true},
    {name:'Kamaa Club', lat:12.9234, lon:100.8714, price:10000, in:true},
    {name:'Sutraa by Kamaa', lat:12.9237, lon:100.8717, price:8000, in:true, after:true},
    {name:'Tonys Club', lat:12.9229, lon:100.8711, price:10000, in:true},
    {name:'Boss Club', lat:12.9252, lon:100.8703, price:10000, in:true},
    {name:'Mashaal', lat:12.9256, lon:100.8712, price:8000, in:true, after:true},
    {name:'Barone by Nashaa', lat:12.9247, lon:100.8719, price:8000, in:true, after:true},
    {name:'Nashaa Space', lat:12.9249, lon:100.8714, price:8000, in:true, after:true},
    {name:'World Club House', lat:12.9232, lon:100.8712, price:15000},
    {name:'Insomnia', lat:12.9236, lon:100.8709, price:12000},
    {name:'Space Club', lat:12.9240, lon:100.8706, price:8000},
    {name:'808 Club', lat:12.9228, lon:100.8715, price:8000},
    {name:'Lucifer Disco', lat:12.9233, lon:100.8710, price:6000},
    {name:'Myst Pattaya', lat:12.9250, lon:100.8722, price:10000}
  ];

  var map = L.map('map', { zoomControl:false, attributionControl:false }).setView([12.9236, 100.8712], 16);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 20, subdomains:'abcd'
  }).addTo(map);
  L.control.zoom({ position:'bottomright' }).addTo(map);

  function popupHtml(c){
    var order = 'https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent('Namaste! I would like to book '+c.name+' (VIP table). Please confirm availability.');
    var view = '/services.html?cat=' + encodeURIComponent('Nightlife & Bars') + '&q=' + encodeURIComponent(c.name);
    return '<div class="pop"><b>'+c.name+'</b>'+(c.in?' <span style="color:#ff9933;font-weight:800;font-size:11px">INDIAN</span>':'')+
      '<div class="pp">VIP table from THB '+c.price.toLocaleString()+'</div>'+
      '<a href="'+order+'" target="_blank">Book on WhatsApp</a><a class="v" href="'+view+'">View menu</a></div>';
  }

  var markers = [];
  CLUBS.forEach(function(c){
    var icon;
    if (c.in) {
      icon = L.divIcon({ className:'', html:'<div class="mk"><span class="lg">\u26A1</span><span class="nm">'+c.name+'</span></div>', iconSize:null });
    } else {
      icon = L.divIcon({ className:'', html:'<div class="dot"></div>', iconSize:null });
    }
    var m = L.marker([c.lat, c.lon], { icon:icon }).addTo(map).bindPopup(popupHtml(c));
    markers.push({ c:c, m:m });
  });

  var filter = 'all', qstr = '';
  window.setFilter = function(el, f){
    filter = f;
    var chips = document.querySelectorAll('.chip'); for (var i=0;i<chips.length;i++) chips[i].classList.remove('on');
    el.classList.add('on');
    applyFilter();
  };
  window.applyFilter = function(){
    qstr = (document.getElementById('q').value||'').toLowerCase();
    markers.forEach(function(x){
      var ok = true;
      if (filter==='indian' && !x.c.in) ok = false;
      if (filter==='after' && !x.c.after) ok = false;
      if (qstr && x.c.name.toLowerCase().indexOf(qstr) < 0) ok = false;
      if (ok) { if(!map.hasLayer(x.m)) x.m.addTo(map); }
      else { if(map.hasLayer(x.m)) map.removeLayer(x.m); }
    });
  };

  var youMarker = null;
  window.locate = function(){
    if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(function(pos){
      var ll = [pos.coords.latitude, pos.coords.longitude];
      if(youMarker) map.removeLayer(youMarker);
      youMarker = L.circleMarker(ll, { radius:8, color:'#22d3ee', fillColor:'#22d3ee', fillOpacity:1 }).addTo(map).bindPopup('You are here').openPopup();
      map.setView(ll, 16);
    }, function(){ alert('Could not get your location. Please allow location access.'); }, { enableHighAccuracy:true, timeout:10000 });
  };
</script>
</body>
</html>
