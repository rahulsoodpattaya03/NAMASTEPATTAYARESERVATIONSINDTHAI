<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Games — Namaste Pattaya Reservations</title>
<link rel="icon" href="/logo.png">
<style>
  :root{--gold:#f59e0b;--cyan:#22d3ee}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0b0f19;color:#e8e8ef;font-family:system-ui,-apple-system,Arial,sans-serif;display:flex;flex-direction:column;height:100vh}
  header{padding:12px 16px;border-bottom:1px solid #1e2740;background:linear-gradient(180deg,#0b0f19,#0b0f19f2)}
  .top{display:flex;align-items:center;justify-content:space-between}
  a.back{color:#8b93a7;text-decoration:none;font-size:13px}
  .title{font-weight:900;font-size:16px;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f59e0b,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite}
  @keyframes sh{to{background-position:300% center}}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch;padding-bottom:2px}
  .tab{white-space:nowrap;padding:9px 14px;border-radius:20px;border:1px solid #26314d;background:#0d1424;color:#c7cddb;font-size:13px;font-weight:700;cursor:pointer}
  .tab.on{background:var(--gold);color:#1a1204;border-color:var(--gold)}
  .frameWrap{flex:1;min-height:0}
  iframe{width:100%;height:100%;border:0;display:block;background:#0a0a0a}
</style>
</head>
<body>
<header>
  <div class="top">
    <a class="back" href="/">&larr; Back to home</a>
    <div class="title">🎉 Party Games</div>
    <span style="width:60px"></span>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="frameWrap"><iframe id="frame" src="/games/game1.html" title="game"></iframe></div>
<script>
  var GAMES=[
    {name:'🎴 Truth or Dare', src:'/games/game1.html'},
    {name:'🃏 Pok Deng', src:'/games/game2.html'},
    {name:'🎯 Most Likely To', src:'/games/game3.html'},
    {name:'🎰 Drink Roulette', src:'/games/game4.html'}
  ];
  var active=0;
  function render(){
    document.getElementById('tabs').innerHTML = GAMES.map(function(g,i){
      return '<span class="tab'+(i===active?' on':'')+'" onclick="pick('+i+')">'+g.name+'</span>';
    }).join('');
  }
  window.pick=function(i){ active=i; document.getElementById('frame').src=GAMES[i].src; render(); };
  render();
</script>
</body>
</html>
