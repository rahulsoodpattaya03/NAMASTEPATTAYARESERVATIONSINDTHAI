<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattaya Namaste — All Services</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--darkbg:#0b0f19;--cardbg:#131c2e;--gold:#f59e0b;--purple:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:var(--darkbg);color:#e8e8ef}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0b0f19,#0b0f19ee);padding:16px 18px;border-bottom:1px solid #1e2740}
  .brand{font-size:20px;font-weight:800}
  .brand span{color:var(--gold)}
  .sub{color:#8b93a7;font-size:12px;margin-top:2px}
  .controls{max-width:1100px;margin:0 auto;padding:12px 18px}
  #q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #26314d;background:#0d1424;color:#e8e8ef;font-size:14px}
  #tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tab{padding:7px 13px;border-radius:20px;border:1px solid #26314d;background:#0d1424;color:#c7cddb;font-size:12px;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:8px 18px 40px}
  h3.cat{color:var(--gold);margin:22px 0 10px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--cardbg);border:1px solid #1e2740;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .ph{height:140px;background:#0d1424;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .body{padding:11px 13px;display:flex;flex-direction:column;flex:1}
  .name{font-weight:700;font-size:14px}
  .desc{color:#9aa3b7;font-size:12px;margin:5px 0 10px;flex:1}
  .row{display:flex;align-items:center;justify-content:space-between}
  .price{color:#34d399;font-weight:800}
  .unit{color:#7b8398;font-size:11px}
  .enq{padding:6px 11px;border:none;border-radius:9px;background:#25D366;color:#04351a;font-weight:700;font-size:11px;cursor:pointer}
  .empty{color:#8b93a7;text-align:center;padding:40px}
  a.back{color:#8b93a7;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="controls" style="padding-top:0;padding-bottom:0">
    <a class="back" href="/">&larr; Back to home</a>
    <div class="brand">🙏 Pattaya <span>Namaste</span> — All Services</div>
    <div class="sub" id="count">Loading listings…</div>
  </div>
</header>
<div class="controls">
  <input id="q" placeholder="Search services, places, prices…" oninput="render()">
  <div id="tabs"></div>
</div>
<main id="list"></main>

<script>
  // EDIT THIS to your WhatsApp number (country code, no +)
  var WHATSAPP = "66947623990";
  var DATA = [], cats = ["All"], active = "All";

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }

  fetch('./pn-catalog.json').then(function(r){return r.json();}).then(function(rows){
    DATA = rows;
    rows.forEach(function(x){ if(cats.indexOf(x.category)<0) cats.push(x.category); });
    document.getElementById('count').textContent = rows.length + ' listings · ' + (cats.length-1) + ' categories · prices in ฿';
    var params = new URLSearchParams(location.search);
    var c = params.get('cat');
    if (c) { var hit = cats.filter(function(x){return x.toLowerCase()===c.toLowerCase();})[0]; if(hit) active = hit; }
    var qp = params.get('q'); if (qp) { document.getElementById('q').value = qp; }
    renderTabs(); render();
  }).catch(function(e){
    document.getElementById('list').innerHTML = '<div class="empty">Could not load listings. Make sure pn-catalog.json is deployed.</div>';
  });

  function renderTabs(){
    document.getElementById('tabs').innerHTML = cats.map(function(c,i){
      return '<span class="tab'+(c===active?' on':'')+'" onclick="pick('+i+')">'+esc(c)+'</span>';
    }).join('');
  }
  window.pick = function(i){ active = cats[i]; renderTabs(); render(); };
  window.enquire = function(i){
    var r = DATA[i];
    var msg = encodeURIComponent('Hi Pattaya Namaste! I would like to enquire about: '+r.item+' (฿'+r.price_thb+' '+r.unit+').');
    window.open('https://wa.me/'+WHATSAPP+'?text='+msg,'_blank');
  };
  function imgErr(el,emoji){ var w=el.parentNode; el.style.display='none'; w.innerHTML='<span style="font-size:42px">'+emoji+'</span>'; }
  window._imgErr = imgErr;

  window.render = function(){
    var q = (document.getElementById('q').value||'').toLowerCase();
    var h='', last=null, open=false, shown=0;
    for (var i=0;i<DATA.length;i++){ var r=DATA[i];
      if (active!=='All' && r.category!==active) continue;
      if (q){ var hay=(r.item+' '+r.notes+' '+r.category+' '+r.price_thb).toLowerCase(); if(hay.indexOf(q)<0) continue; }
      if (r.category!==last){ if(open) h+='</div>'; h+='<h3 class="cat">'+esc(r.category)+'</h3><div class="grid">'; open=true; last=r.category; }
      h += '<div class="card"><div class="ph"><img src="'+esc(r.image_url)+'" loading="lazy" onerror="_imgErr(this,&#39;'+r.emoji+'&#39;)"></div>'
        + '<div class="body"><div class="name">'+esc(r.item)+'</div><div class="desc">'+esc(r.notes)+'</div>'
        + '<div class="row"><div><span class="price">฿'+Number(r.price_thb).toLocaleString()+'</span> <span class="unit">'+esc(r.unit)+'</span></div>'
        + '<button class="enq" onclick="enquire('+i+')"><i class="fa-brands fa-whatsapp"></i> Enquire</button></div></div></div>';
      shown++;
    }
    if(open) h+='</div>';
    if(!shown) h='<div class="empty">No results.</div>';
    document.getElementById('list').innerHTML = h;
  };
</script>
</body>
</html>
