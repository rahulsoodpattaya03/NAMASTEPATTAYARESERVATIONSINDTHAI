<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Pattaya Reservations — Super-App</title>
<link rel="icon" href="/logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root{--darkbg:#0b0f19;--cardbg:#131c2e;--gold:#f59e0b;--purple:#8b5cf6;--cyan:#22d3ee}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Arial,sans-serif;background:var(--darkbg);color:#e8e8ef;padding-bottom:90px}
  header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#0b0f19,#0b0f19f2);padding:14px 18px;border-bottom:1px solid #1e2740}
  .brandrow{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
  .logo{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;background:linear-gradient(135deg,#f59e0b,#8b5cf6,#22d3ee);box-shadow:0 4px 18px rgba(139,92,246,.5);overflow:hidden}
  .brand{font-size:19px;font-weight:900;letter-spacing:.3px;line-height:1.05;background:linear-gradient(90deg,#22d3ee,#a78bfa,#f59e0b,#22d3ee);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
  @keyframes shine{to{background-position:300% center}}
  .tag{color:#8b93a7;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .controls{max-width:1100px;margin:0 auto;padding:12px 18px}
  a.back{color:#8b93a7;text-decoration:none;font-size:13px}
  #q{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #26314d;background:#0d1424;color:#e8e8ef;font-size:14px}
  #tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .tab{padding:7px 13px;border-radius:20px;border:1px solid #26314d;background:#0d1424;color:#c7cddb;font-size:12px;cursor:pointer;white-space:nowrap}
  .tab.on{background:var(--gold);color:#1a1204;border-color:var(--gold);font-weight:700}
  main{max-width:1100px;margin:0 auto;padding:8px 18px 40px}
  h3.cat{color:var(--gold);margin:22px 0 10px;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .card{background:var(--cardbg);border:1px solid #1e2740;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .2s}
  .card:hover{border-color:#3b4a6b}
  .ph{height:140px;background:#0d1424;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .body{padding:11px 13px;display:flex;flex-direction:column;flex:1}
  .name{font-weight:700;font-size:14px}
  .desc{color:#9aa3b7;font-size:12px;margin:5px 0 10px;flex:1}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .from{color:#34d399;font-weight:800;font-size:13px}
  .viewmenu{color:var(--cyan);font-size:12px;font-weight:700}
  .add{padding:7px 12px;border:none;border-radius:9px;background:var(--gold);color:#1a1204;font-weight:800;font-size:12px;cursor:pointer}
  .step{display:flex;align-items:center;gap:8px}
  .step button{width:28px;height:28px;border:none;border-radius:8px;background:#26314d;color:#fff;font-size:16px;font-weight:800;cursor:pointer}
  .step span{min-width:20px;text-align:center;font-weight:800}
  .empty{color:#8b93a7;text-align:center;padding:40px}
  /* overlays */
  .overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none}
  .panel{position:absolute;right:0;top:0;bottom:0;width:100%;max-width:460px;background:#0e1524;display:flex;flex-direction:column}
  .phead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #1e2740;gap:10px}
  .phead b{font-size:16px}
  .phead .x{background:none;border:none;color:#aaa;font-size:26px;cursor:pointer}
  .pbody{flex:1;overflow-y:auto;padding:8px 18px 18px}
  .pimg{height:150px;border-radius:12px;overflow:hidden;background:#0d1424;display:flex;align-items:center;justify-content:center;margin:12px 0}
  .pimg img{width:100%;height:100%;object-fit:cover}
  .mitem{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #182238}
  .mitem .n{flex:1;font-size:14px}
  .mitem .mp{color:#34d399;font-weight:800;min-width:64px;text-align:right}
  .drow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #182238}
  .drow .n{flex:1;font-size:13px}
  .drow .n small{color:#7b8398;display:block}
  .dfoot{padding:16px 18px;border-top:1px solid #1e2740}
  .tot{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-bottom:12px}
  .tot .amt{color:#34d399}
  .pay{display:grid;gap:8px;margin:10px 0 14px}
  .pay label{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #26314d;border-radius:10px;font-size:14px;cursor:pointer}
  .pay label.sel{border-color:var(--gold);background:#1a1608}
  .cta{width:100%;padding:14px;border:none;border-radius:12px;background:#25D366;color:#04351a;font-weight:900;font-size:15px;cursor:pointer}
  .note{color:#7b8398;font-size:11px;text-align:center;margin-top:8px}
  #cartbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;justify-content:space-between;align-items:center;max-width:1100px;margin:0 auto;padding:14px 18px;background:linear-gradient(90deg,#8b5cf6,#22d3ee);color:#06121f;font-weight:800;border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.5);cursor:pointer}
  #cartbar .go{background:#06121f;color:#fff;padding:9px 16px;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<header>
  <div class="controls" style="padding:0 0 6px 0"><a class="back" href="/">&larr; Back to home</a></div>
  <div class="brandrow">
    <div class="logo"><img src="/logo.png" alt="logo" onerror="this.parentNode.textContent='🙏'" style="width:100%;height:100%;object-fit:cover;border-radius:14px"></div>
    <div>
      <div class="brand">NAMASTE PATTAYA RESERVATIONS</div>
      <div class="tag">✨ Super-App · Book · Party · Enjoy 🎉</div>
    </div>
  </div>
</header>
<div class="controls">
  <input id="q" placeholder="Search providers, places…" oninput="render()">
  <div id="tabs"></div>
</div>
<main id="list"></main>

<!-- Provider menu overlay -->
<div class="overlay" id="provOverlay">
  <div class="panel">
    <div class="phead"><b id="provName">Provider</b><button class="x" onclick="closeProvider()">&times;</button></div>
    <div class="pbody" id="provBody"></div>
    <div class="dfoot"><button class="cta" onclick="openCart()">View Basket &amp; Checkout</button></div>
  </div>
</div>

<!-- Cart overlay -->
<div class="overlay" id="cartOverlay">
  <div class="panel">
    <div class="phead"><b>🛒 Your Basket</b><button class="x" onclick="closeCart()">&times;</button></div>
    <div class="pbody" id="ditems"></div>
    <div class="dfoot">
      <div class="tot"><span>Total</span><span class="amt" id="grand">฿0</span></div>
      <div id="paywrap" style="display:none">
        <div style="font-weight:800;margin-bottom:6px">Payment method</div>
        <div class="pay" id="pay"></div>
      </div>
      <button class="cta" id="cta" onclick="checkoutStep()">Checkout</button>
      <div class="note">Online card payment coming soon — for now your order is confirmed &amp; paid via WhatsApp.</div>
    </div>
  </div>
</div>

<!-- Cart bar -->
<div id="cartbar" onclick="openCart()">
  <span id="cartsummary">🛒 0 items</span>
  <span class="go">View basket →</span>
</div>

<script>
  var WHATSAPP = "66947623990";
  var DATA = [], MENUS = {}, cats = ["All"], active = "All";
  var cart = {};      // key "provIdx::itemIdx" -> {label, price, qty}
  var curProv = null;
  var stage = "cart";
  var payMethods = ["PromptPay / QR", "Credit / Debit Card", "Bank Transfer", "Cash on Arrival"];
  var payChoice = payMethods[0];

  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function baht(n){ return '฿' + Number(n||0).toLocaleString('en-US'); }
  function menuOf(i){ return MENUS[DATA[i].id] || [{n:'Book this service',p:DATA[i].price_thb}]; }
  function minPrice(i){ var m=menuOf(i); var lo=m[0].p; for(var j=1;j<m.length;j++) if(m[j].p<lo) lo=m[j].p; return lo; }

  Promise.all([
    fetch('./pn-catalog.json').then(function(r){return r.json();}),
    fetch('./menus.json').then(function(r){return r.json();}).catch(function(){return {};}),
    fetch('./clubs.json').then(function(r){return r.json();}).catch(function(){return {providers:[],menus:{}};})
  ]).then(function(res){
    DATA = res[0]; MENUS = res[1] || {};
    var extra = res[2] || {providers:[],menus:{}};
    if(extra.menus){ for(var mk in extra.menus) MENUS[mk]=extra.menus[mk]; }
    if(extra.providers && extra.providers.length){
      var firstIdx=-1; for(var k=0;k<DATA.length;k++){ if(DATA[k].category==='Nightlife & Bars'){ firstIdx=k; break; } }
      if(firstIdx>=0){ Array.prototype.splice.apply(DATA,[firstIdx,0].concat(extra.providers)); }
      else { DATA=DATA.concat(extra.providers); }
    }
    DATA.forEach(function(x){ if(cats.indexOf(x.category)<0) cats.push(x.category); });
    var params = new URLSearchParams(location.search);
    var c = params.get('cat');
    if (c){ var hit = cats.filter(function(x){return x.toLowerCase()===c.toLowerCase();})[0]; if(hit) active = hit; }
    var qp = params.get('q'); if(qp) document.getElementById('q').value = qp;
    renderTabs(); render(); updateBar();
  }).catch(function(){
    document.getElementById('list').innerHTML = '<div class="empty">Could not load listings.</div>';
  });

  function renderTabs(){
    document.getElementById('tabs').innerHTML = cats.map(function(c,i){
      return '<span class="tab'+(c===active?' on':'')+'" onclick="pick('+i+')">'+esc(c)+'</span>';
    }).join('');
  }
  window.pick = function(i){ active = cats[i]; renderTabs(); render(); };
  function imgErr(el,emoji){ var w=el.parentNode; el.style.display='none'; w.innerHTML='<span style="font-size:42px">'+emoji+'</span>'; }
  window._imgErr = imgErr;

  window.render = function(){
    var q = (document.getElementById('q').value||'').toLowerCase();
    var h='', last=null, open=false, shown=0;
    for (var i=0;i<DATA.length;i++){ var r=DATA[i];
      if (active!=='All' && r.category!==active) continue;
      if (q){ var hay=(r.item+' '+r.notes+' '+r.category).toLowerCase(); if(hay.indexOf(q)<0) continue; }
      if (r.category!==last){ if(open) h+='</div>'; h+='<h3 class="cat">'+esc(r.category)+'</h3><div class="grid">'; open=true; last=r.category; }
      h += '<div class="card" onclick="openProvider('+i+')"><div class="ph"><img src="'+esc(r.image_url)+'" loading="lazy" onerror="_imgErr(this,&#39;'+r.emoji+'&#39;)"></div>'
        + '<div class="body"><div class="name">'+esc(r.item)+'</div><div class="desc">'+esc(r.notes)+'</div>'
        + '<div class="row"><span class="from">from '+baht(minPrice(i))+' <span style="color:#7b8398;font-weight:500;font-size:11px">'+esc(r.unit||'')+'</span></span><span class="viewmenu">View menu →</span></div></div></div>';
      shown++;
    }
    if(open) h+='</div>';
    if(!shown) h='<div class="empty">No results.</div>';
    document.getElementById('list').innerHTML = h;
  };

  // ---- Provider detail ----
  window.openProvider = function(i){
    curProv = i; var r = DATA[i];
    document.getElementById('provName').textContent = r.item;
    document.getElementById('provOverlay').style.display = 'block';
    renderProvider();
  };
  window.closeProvider = function(){ document.getElementById('provOverlay').style.display='none'; };
  function renderProvider(){
    var i=curProv, r=DATA[i], m=menuOf(i);
    var h = '<div class="pimg"><img src="'+esc(r.image_url)+'" onerror="_imgErr(this,&#39;'+r.emoji+'&#39;)"></div>';
    h += '<div class="desc" style="margin:0 0 6px">'+esc(r.notes)+'</div>';
    h += '<div style="color:#8b93a7;font-size:12px;margin-bottom:6px">'+esc(r.category)+(r.unit?(' · '+esc(r.unit)):'')+'</div>';
    for (var j=0;j<m.length;j++){
      var pk=i+'::'+j; var it=m[j]; var ctrl;
      if (cart[pk]){ ctrl='<div class="step"><button onclick="decKey(\''+pk+'\')">−</button><span>'+cart[pk].qty+'</span><button onclick="incKey(\''+pk+'\')">+</button></div>'; }
      else { ctrl='<button class="add" onclick="incKey(\''+pk+'\')">Add +</button>'; }
      h += '<div class="mitem"><div class="n">'+esc(it.n)+'</div><div class="mp">'+baht(it.p)+'</div>'+ctrl+'</div>';
    }
    document.getElementById('provBody').innerHTML = h;
  }

  // ---- Cart ops (keyed) ----
  window.incKey = function(pk){
    if(!cart[pk]){ var p=pk.split('::'); var i=+p[0], j=+p[1]; var it=menuOf(i)[j];
      cart[pk]={label:DATA[i].item+' — '+it.n, price:it.p, qty:0}; }
    cart[pk].qty++; afterCartChange();
  };
  window.decKey = function(pk){ if(cart[pk]){ cart[pk].qty--; if(cart[pk].qty<=0) delete cart[pk]; } afterCartChange(); };
  function afterCartChange(){
    updateBar();
    if(document.getElementById('provOverlay').style.display==='block') renderProvider();
    if(document.getElementById('cartOverlay').style.display==='block') renderCart();
  }
  function totals(){ var items=0,sum=0; for(var k in cart){ items+=cart[k].qty; sum+=cart[k].qty*cart[k].price; } return {items:items,sum:sum}; }
  function updateBar(){
    var t=totals(); var bar=document.getElementById('cartbar');
    if(t.items>0){ bar.style.display='flex'; document.getElementById('cartsummary').textContent='🛒 '+t.items+' item'+(t.items>1?'s':'')+' · '+baht(t.sum); }
    else bar.style.display='none';
  }

  window.openCart = function(){ stage='cart'; document.getElementById('cartOverlay').style.display='block'; renderCart(); };
  window.closeCart = function(){ document.getElementById('cartOverlay').style.display='none'; };
  function renderCart(){
    var h=''; var keys=Object.keys(cart);
    if(!keys.length) h='<div class="empty">Your basket is empty.</div>';
    keys.forEach(function(k){ var c=cart[k];
      h+='<div class="drow"><div class="n">'+esc(c.label)+'<small>'+baht(c.price)+' each</small></div>'
       + '<div class="step"><button onclick="decKey(\''+k+'\')">−</button><span>'+c.qty+'</span><button onclick="incKey(\''+k+'\')">+</button></div>'
       + '<div style="min-width:64px;text-align:right;font-weight:800">'+baht(c.qty*c.price)+'</div></div>';
    });
    document.getElementById('ditems').innerHTML=h;
    document.getElementById('grand').textContent=baht(totals().sum);
    var paywrap=document.getElementById('paywrap'), cta=document.getElementById('cta');
    if(stage==='pay'){
      paywrap.style.display='block';
      document.getElementById('pay').innerHTML = payMethods.map(function(m){
        return '<label class="'+(m===payChoice?'sel':'')+'" onclick="choosePay(\''+m.replace(/'/g,"")+'\')"><i class="fa-solid fa-circle'+(m===payChoice?'-check':'')+'"></i> '+m+'</label>';
      }).join('');
      cta.textContent='Place Order · '+baht(totals().sum);
    } else { paywrap.style.display='none'; cta.textContent='Checkout'; }
  }
  window.choosePay = function(m){ payChoice=m; renderCart(); };
  window.checkoutStep = function(){
    var t=totals(); if(!t.items) return;
    if(stage==='cart'){ stage='pay'; renderCart(); return; }
    var lines=[]; Object.keys(cart).forEach(function(k){ var c=cart[k]; lines.push('• '+c.label+' x'+c.qty+' = '+baht(c.qty*c.price)); });
    var text='🙏 Namaste Pattaya Reservations — NEW ORDER\n\n'+lines.join('\n')+'\n\nTotal: '+baht(t.sum)+'\nPayment: '+payChoice+'\n\nPlease confirm my booking.';
    window.open('https://wa.me/'+WHATSAPP+'?text='+encodeURIComponent(text),'_blank');
  };
</script>
</body>
</html>
