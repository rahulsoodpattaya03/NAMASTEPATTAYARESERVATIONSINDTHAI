<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaste Match</title>
    <style>
        :root {
            --midnight-blue: #1A1A2E;
            --saffron-orange: #FF9933;
            --gold: #FFD700;
            --white: #FFFFFF;
            --gray: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--midnight-blue);
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 800px;
            background-color: #111122;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: var(--saffron-orange);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .mr-india-toggle {
            font-size: 14px;
            background: linear-gradient(45deg, #444, #222);
            color: var(--white);
            padding: 5px 10px;
            border-radius: 20px;
            border: 1px solid var(--gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .mr-india-toggle.active {
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Card Stack */
        .card-container {
            flex-grow: 1;
            position: relative;
            padding: 15px;
            perspective: 1000px;
        }

        .profile-card {
            width: calc(100% - 30px);
            height: calc(100% - 30px);
            position: absolute;
            border-radius: 20px;
            overflow: hidden;
            background: #2A2A40;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: grab;
        }

        /* Placeholder image gradient for Nirmal */
        .card-image {
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 40%, rgba(26,26,46,1)), 
                        url('https://images.unsplash.com/photo-1617069399222-26330ceac418?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80') center/cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 20px;
            z-index: 2;
            background: linear-gradient(to top, var(--midnight-blue) 20%, transparent);
        }

        .last-seen {
            color: #00FF00;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .last-seen::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #00FF00;
            border-radius: 50%;
            display: inline-block;
        }

        .name-age {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .premium-badge {
            font-size: 14px;
            color: var(--midnight-blue);
            background: var(--gold);
            padding: 2px 8px;
            border-radius: 10px;
            vertical-align: middle;
            margin-left: 10px;
            font-weight: bold;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .bio-prompt {
            font-size: 14px;
            line-height: 1.4;
            color: #ccc;
            font-style: italic;
            border-left: 3px solid var(--saffron-orange);
            padding-left: 10px;
        }

        /* Action Buttons */
        .actions {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 10px 0 30px 0;
            z-index: 10;
        }

        .btn {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.9);
        }

        .btn-pass {
            background-color: #2A2A40;
            color: #FF4444;
            border: 2px solid #FF4444;
        }

        .btn-cheers {
            background-color: #2A2A40;
            color: var(--saffron-orange);
            border: 2px solid var(--saffron-orange);
            width: 75px;
            height: 75px;
            font-size: 34px;
        }

        .btn-vip {
            background-color: #2A2A40;
            color: var(--gold);
            border: 2px solid var(--gold);
        }

        /* Swipe Animations */
        .swipe-left { transform: translateX(-150%) rotate(-20deg); opacity: 0; }
        .swipe-right { transform: translateX(150%) rotate(20deg); opacity: 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div>🔥 Namaste</div>
            <div class="mr-india-toggle" id="mrIndiaBtn" onclick="toggleMrIndia()">
                🕶️ Mr. India Mode
            </div>
        </div>

        <div class="card-container" id="cardContainer">
            <div class="profile-card" id="mainCard">
                <div class="card-image"></div>
                <div class="card-info">
                    <div class="last-seen">Active Now</div>
                    <div class="name-age">Nirmal Shah, 32 <span class="premium-badge">VIP</span></div>
                    
                    <div class="tags">
                        <div class="tag">📍 Jannaat Club</div>
                        <div class="tag">🥃 Whiskey</div>
                        <div class="tag">🎵 Punjabi</div>
                        <div class="tag">👥 Group of Friends</div>
                    </div>

                    <div class="bio-prompt">
                        "Looking to lock down a VIP table later, need a fun crowd to share the vibe and hit the dance floor."
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-pass" onclick="swipe('left')">✖</button>
            <button class="btn btn-cheers" onclick="swipe('right')">🥂</button>
            <button class="btn btn-vip" onclick="superVip()">⭐</button>
        </div>
    </div>

    <script>
        // Toggle Mr. India Ghost Mode
        function toggleMrIndia() {
            const btn = document.getElementById('mrIndiaBtn');
            btn.classList.toggle('active');
            if (btn.classList.contains('active')) {
                btn.innerHTML = '👻 Invisible';
                alert('Mr. India Mode ON: You are hidden from the public stack. Premium users cannot be blocked.');
            } else {
                btn.innerHTML = '🕶️ Mr. India Mode';
                alert('Mr. India Mode OFF: You are visible again.');
            }
        }

        // Handle Card Swiping
        function swipe(direction) {
            const card = document.getElementById('mainCard');
            if (direction === 'left') {
                card.classList.add('swipe-left');
            } else {
                card.classList.add('swipe-right');
            }
            
            // Reset card after animation for demo purposes
            setTimeout(() => {
                card.style.transition = 'none';
                card.classList.remove('swipe-left', 'swipe-right');
                card.style.opacity = '0';
                
                setTimeout(() => {
                    card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                    card.style.opacity = '1';
                }, 50);
            }, 300);
        }

        // Super VIP Button
        function superVip() {
            alert('Super VIP sent! Unblockable message delivered directly to Nirmal.');
        }
    </script>
</body>
</html>
