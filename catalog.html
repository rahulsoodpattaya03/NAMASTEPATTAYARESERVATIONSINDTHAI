<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Namaste Pattaya — Service Catalog</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, Arial, sans-serif; background: #0b0f19; color: #e8e8ef; line-height: 1.5; }
  header { background: linear-gradient(90deg,#111,#1a1230); text-align: center; padding: 32px 16px; border-bottom: 2px solid #ffd700; }
  header h1 { color: #ffd700; letter-spacing: 1px; font-size: 26px; }
  header p { color: #b9b9c9; margin-top: 8px; font-size: 14px; }
  .grid { max-width: 1100px; margin: 0 auto; padding: 24px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { background: #0e1524; border: 1px solid #26314d; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 16px rgba(0,0,0,.4); transition: transform .15s ease; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; height: 190px; object-fit: cover; display: block; background:#1a2336; }
  .card .body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .card h2 { font-size: 18px; margin-bottom: 6px; }
  .badge { display: inline-block; background: #e53935; color: #fff; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 5px; margin-bottom: 8px; align-self: flex-start; }
  .pitch { font-size: 14px; color: #dcdce6; margin-bottom: 10px; }
  .meta { font-size: 13px; color: #9aa3b8; margin-top: auto; }
  .meta b { color: #c7cedf; }
  footer { text-align: center; padding: 24px 16px; color: #6b7280; font-size: 12px; border-top: 1px solid #26314d; }
</style>
</head>
<body>

const grid = document.getElementById('grid');
SERVICES.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  const badge = s.discount ? '<span class="badge">UP TO ' + s.discount + '% OFF</span>' : '';
  card.innerHTML =
    '<img src="' + s.img + '" alt="' + s.category + '" loading="lazy" onerror="this.style.display=\'none\'">' +
    '<div class="body">' +
      '<h2>' + s.category + '</h2>' +
      badge +
      '<p class="pitch">' + s.pitch + '</p>' +
      '<div class="meta"><b>Price:</b> ' + s.price + '<br><b>Examples:</b> ' + s.examples + '</div>' +

</body>
</html>
